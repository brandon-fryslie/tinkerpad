name: Deploy playgrounds
on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: brandon-fryslie/gh-pages-multiplexer@v1
        with:
          source-dir: public/playgrounds
