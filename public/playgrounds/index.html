<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tinkerpad · Playgrounds</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06070b;--s1:#0e0f16;--s2:#151722;--bdr:#272a3a;
  --txt:#e7e8f0;--dim:#7b7e95;--acc:#9d7bff;--acc2:#c5b3ff;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Monaco,monospace;
}
html,body{min-height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.55}
body{padding:48px 24px;max-width:780px;margin:0 auto}
header{margin-bottom:36px}
h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
h1 .ac{color:var(--acc2)}
.sub{color:var(--dim);font-size:13px;margin-top:6px;font-family:var(--mono)}
ul{list-style:none;display:grid;gap:10px}
a.card{display:block;padding:18px 20px;background:var(--s1);border:1px solid var(--bdr);border-radius:12px;text-decoration:none;color:var(--txt);transition:border-color .15s, background .15s}
a.card:hover{border-color:var(--acc);background:var(--s2)}
.name{font-size:16px;font-weight:600;margin-bottom:4px}
.name .arrow{color:var(--dim);margin-left:6px;transition:color .15s,transform .15s;display:inline-block}
a.card:hover .name .arrow{color:var(--acc);transform:translateX(2px)}
.desc{font-size:13px;color:var(--dim)}
.file{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:6px}
footer{margin-top:40px;color:var(--dim);font-size:12px;font-family:var(--mono)}
footer a{color:var(--acc2)}
</style>
</head>
<body>
<header>
  <h1><span class="ac">◈</span> Tinkerpad Playgrounds</h1>
  <div class="sub">self-contained HTML explorers</div>
</header>
<ul>
  <li><a class="card" href="./shader-reactive.html">
    <div class="name">Music-Reactive WebGPU Shader <span class="arrow">→</span></div>
    <div class="desc">Design a music-reactive fragment shader — iPad-friendly controls, real-time FFT, copyable WGSL prompt.</div>
    <div class="file">shader-reactive.html</div>
  </a></li>
</ul>
<footer>Deployed via <a href="https://github.com/brandon-fryslie/gh-pages-multiplexer">gh-pages-multiplexer</a>.</footer>
</body>
</html>
